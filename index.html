<script>
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LB={J:'Jahe',L:'Lengkuas'};
const REF={J:{n:'Jahe (Zingiber officinale)',f:'Ginger_Root.jpg',a:'foto: Sanjay Acharya, CC BY-SA'},L:{n:'Lengkuas (Alpinia galanga)',f:'Lengkuas.jpg',a:'foto: Wikimedia Indonesia (WikiKaleidoskop), CC BY-SA 4.0'}};
// Foto referensi untuk kartu uji. Foto hanya membantu siswa mengamati objek;
// model simulasi tetap memproses tiga angka ciri sintetis, bukan piksel foto.
const TEST_PHOTOS={
 J:{url:'https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fa/Ginger_Root.jpg/960px-Ginger_Root.jpg',fallback:'https://commons.wikimedia.org/wiki/Special:FilePath/Ginger_Root.jpg?width=700',page:'https://commons.wikimedia.org/wiki/File:Ginger_Root.jpg',credit:'Sanjay Acharya · CC BY-SA 4.0'},
 L:{url:'https://upload.wikimedia.org/wikipedia/commons/thumb/4/46/Lengkuas.jpg/960px-Lengkuas.jpg',fallback:'https://commons.wikimedia.org/wiki/Special:FilePath/Lengkuas.jpg?width=700',page:'https://commons.wikimedia.org/wiki/File:Lengkuas.jpg',credit:'Herusutimbul · CC BY-SA 4.0'}
};
const photoImg=(s,cls='sample-photo')=>{const p=TEST_PHOTOS[s.y==='J'?'J':'L'];return `<img class="${cls}" src="${p.url}" alt="Foto rimpang untuk diamati" loading="eager" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='${p.fallback}'}else{this.style.display='none'}">`};
const photoCard=s=>{const p=TEST_PHOTOS[s.y==='J'?'J':'L'];return `<figure class="test-figure">${photoImg(s,'test-photo')}<figcaption hidden>Foto tidak termuat. Periksa koneksi internet.</figcaption><figcaption>Foto referensi · <a href="${p.page}" target="_blank" rel="noopener">sumber &amp; lisensi</a></figcaption></figure>`};
const ph=k=>{const r=REF[k];return`<figure><img src="https://commons.wikimedia.org/wiki/Special:FilePath/${r.f}?width=700" alt="Foto ${r.n}" loading=lazy onerror="this.parentNode.classList.add('x')"><figcaption><b>${r.n}</b><br>${r.a} · <a href="https://commons.wikimedia.org/wiki/File:${r.f}" target=_blank rel=noopener>sumber di Wikimedia Commons</a></figcaption></figure>`};
const mt=(v,m,c)=>`<span class=mt><i style="width:${Math.min(100,v/m*100)}%;background:${c}"></i></span>`;
const meters=f=>`Lebar ${f[0]} cm${mt(f[0],8,'#0f766e')}Cincin ${f[1]}${mt(f[1],10,'#7c3aed')}Merah ${f[2]}${mt(f[2],10,'#dc2626')}`;
const STL=['','Pra-tes','Kenali','Latih','Uji','Masalah','Perbaiki','Pasca-tes','Ringkas'];
/* ===== DATA (sintetis, dibuat dari rentang ciri; bukan hasil pengukuran) ===== */
// Opsional guru: isi URL foto per tipe untuk ditampilkan di kartu, mis. FOTO.jg='foto/jahe-gajah.jpg'
const FOTO={jg:'',je:'',jm:'',lp:'',lm:''};
const FN=['Lebar ruas (cm)','Kejelasan cincin (0–10)','Kemerahan kulit (0–10)'],NORM=[8,10,10];
const SUB={jg:{n:'Jahe gajah',c:'J',r:[[5,7],[2,4],[1,3]]},je:{n:'Jahe emprit',c:'J',r:[[2,3.5],[3,5],[1,3]]},jm:{n:'Jahe merah',c:'J',r:[[2,3.5],[3,5],[6,9]]},lp:{n:'Lengkuas putih',c:'L',r:[[3,5],[7,9],[1,3]]},lm:{n:'Lengkuas merah',c:'L',r:[[3.5,5.5],[4,6.5],[6,9]]}};
SUB.x={n:'Ukur sendiri',c:'?',r:[]};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(seed,spec,pre){const r=rng(seed),o=[];for(const[k,n]of spec)for(let i=0;i<n;i++){const d=SUB[k];o.push({sub:k,y:d.c,f:d.r.map(([a,b])=>+(a+(b-a)*r()).toFixed(1))})}
for(let i=o.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]]}o.forEach((e,i)=>e.id=pre+(i+1));return o}
const POOL=gen(7,[['jg',8],['je',8],['jm',8],['lp',8],['lm',8]],'P'),TEST=gen(21,[['jg',1],['je',2],['jm',3],['lp',2],['lm',4]],'T'),FIN=gen(33,[['jg',1],['je',2],['jm',2],['lp',2],['lm',2]],'F');
const byId=id=>POOL.find(p=>p.id==id)||(S.mine||[]).find(p=>p.id==id);
/* ===== MODEL: k-Nearest Neighbors (k=3), benar-benar dihitung dari data latih ===== */
let MASK=[1,1,1];const withM=(m,fn)=>{const o=MASK;MASK=m;try{return fn()}finally{MASK=o}};const dist=(a,b)=>Math.sqrt(a.f.reduce((s,v,i)=>s+(MASK[i]?((v-b.f[i])/NORM[i])**2:0),0));
const near=(tr,x,k=3)=>tr.map(t=>({t,d:dist(t,x)})).sort((a,b)=>a.d-b.d).slice(0,k);
function predict(tr,x){const n=near(tr,x);let j=0,l=0;n.forEach(e=>e.t.y=='J'?j++:l++);return j>l?'J':'L'}
function ev(tr,set){const res=set.map(s=>({s,p:predict(tr,s)}));return{res,n:set.length,ok:res.filter(r=>r.p==r.s.y).length,wrong:res.filter(r=>r.p!=r.s.y)}}
const trOf=ids=>ids.map(byId);
const validTr=ids=>ids.length>=4&&ids.some(i=>byId(i).y=='J')&&ids.some(i=>byId(i).y=='L');
const comp=tr=>Object.keys(SUB).filter(k=>k!='x'||tr.some(t=>t.sub=='x')).map(k=>`${SUB[k].n}: ${tr.filter(t=>t.sub==k).length}`).join(' · ');
const A_SET=[...POOL.filter(p=>p.sub=='je').slice(0,5),...POOL.filter(p=>p.sub=='lp').slice(0,5)];
const B_SET=Object.keys(SUB).flatMap(k=>POOL.filter(p=>p.sub==k).slice(0,2));
/* ===== STATE ===== */
let ENT=0;
const ROLES=[{k:'a',n:'Pelatih Data',d:'memimpin pemilihan data latih (Babak 2 dan 5) dan memastikan datanya beragam'},{k:'b',n:'Penguji Prediksi',d:'memimpin tebakan dan pembukaan hasil uji (Babak 3)'},{k:'c',n:'Analis Kesalahan',d:'memimpin pencarian penyebab mesin salah (Babak 4)'},{k:'d',n:'Pencatat & Juru Bicara',d:'menulis dugaan dan refleksi kelompok (Babak 1) dan melaporkan hasil ke kelas'}];
const RB={b1:'d',b2:'a',b3:'b',b4:'c',b5:'a'};
const peranTxt=()=>ROLES.map(r=>r.n+'='+(S.rl[r.k]||'-')).join('; ');
const roleBar=st=>{const r=ROLES.find(x=>x.k==RB[st]);if(!r)return'';const n=S.rl[r.k];return`<div class=rolebar><b>Peran bertugas: ${r.n}${n?' — '+esc(n):''}</b><small>Tugas: ${r.d}. Semua anggota tetap berdiskusi sebelum menjawab.</small></div>`};const STEPS=['intro','pre','b1','b2','b3','b4','b5','post','sum'];
const def=()=>({step:'intro',ff:[1,1,1],ff0:null,ff2:null,ffSet:0,mine:[],fin1:null,kode:'',rl:{a:'',b:'',c:'',d:''},pre:{},preT:'',post:{},postT:'',f:[],hip:'',lock1:0,sel:[],tr:null,lock:{},rev:0,rf:{},why:{},w5:'',tr2:null,msg:''});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem('ttm')||'{}'))}catch(e){S=def()}
const save=()=>{try{localStorage.setItem('ttm',JSON.stringify(S))}catch(e){}};
const go=s=>{S.step=s;ENT=1;S.msg='';save();render();scrollTo(0,0)};
const set=(k,v)=>{S[k]=v;save()};

<div class="note"><b>Jujur soal sistem ini:</b> mesin di game ini adalah model Machine Learning <b>sungguhan</b> (k-Nearest Neighbors, k=3) yang dihitung di browsermu dari data yang <i>kamu</i> pilih. Namun mesin tidak "melihat foto": ia membaca 3 angka ciri tiap contoh (lebar ruas, kejelasan cincin, kemerahan kulit). Angka-angka itu adalah <b>data buatan (sintetis)</b> berdasarkan gambaran umum jahe dan lengkuas, bukan hasil pengukuran nyata. Pada ML gambar sungguhan, ciri tersebut dipelajari sendiri dari piksel.</div>
<p>Foto referensi memerlukan internet; tanpa internet, foto diganti kotak abu-abu dan game tetap berfungsi penuh. Game tidak meminta kamera atau data pribadi; cukup nama kelompok dan nama panggilan atau inisial. Progres tersimpan di perangkat ini saja.</p>

b1:()=>{const ex=Object.keys(SUB).flatMap(k=>POOL.filter(p=>p.sub==k).slice(0,2));return`<div class=card><span class=tag>Pengalaman konkret</span><h2>Babak 1 — Kenali Data</h2><div class=duo>${ph('J')}${ph('L')}</div><div class=note>Foto hanya gambaran umum tiap kategori. Mesin <b>tidak melihat foto</b>: ia hanya membaca tiga angka ciri pada kartu di bawah, dan tiap tipe (gajah, emprit, merah, putih) bisa tampak berbeda dari foto.</div><p>Amati contoh berlabel ini. Setiap contoh punya tiga ciri.</p><div class=grid>${ex.map(p=>chip(p,{lab:1,tipe:1})).join('')}</div>

${S.lock1?`<div class=card><span class=tag>Observasi reflektif</span><h3>Sebaran ciri pada ${POOL.length} contoh (min–maks)</h3><table><tr><th>Ciri</th><th>Jahe</th><th>Lengkuas</th></tr>${FN.map((n,i)=>{const r=y=>{const v=POOL.filter(p=>p.y==y).map(p=>p.f[i]);return Math.min(...v)+' – '+Math.max(...v)};return`<tr><td>${n}</td><td>${r('J')}</td><td>${r('L')}</td></tr>`}).join('')}</table>
<div class=note>Perhatikan rentang yang <b>tumpang-tindih</b>: tidak ada satu ciri yang memisahkan kedua kategori dengan sempurna. Itu sebabnya mesin bisa salah.</div>${refl('b1','Apakah dugaanmu sesuai dengan sebaran data? Apa yang mengejutkan?')}<button onclick="nxt('b1','b2')">Lanjut ke Babak 2</button></div>`:''}`},

${S.tr?`<div class=card><span class=tag>Observasi reflektif</span><h3>Ringkasan pelatihan</h3><p>Mesin menyimpan <b>${S.tr.length}</b> contoh latih. ${comp(trOf(S.tr))}</p>${(()=>{const e=ev(trOf(S.tr),trOf(S.tr));return`<p>Akurasi pada <b>data latih</b> sendiri: <b>${e.ok}/${e.n}</b>. Ingat: ini belum membuktikan mesin bisa mengenali contoh baru.</p>`})()}${refl('b2','Apa yang kamu pertimbangkan saat memilih data pelatihan? Apakah pilihanmu sudah beragam?')}<button onclick="nxt('b2','b3')">Lanjut ke Babak 3</button></div>`:''}`,
b3:()=>{const tr=trOf(S.tr),all=TEST.every(t=>S.lock[t.id]);return`<div class=card><span class=tag>Observasi reflektif</span><h2>Babak 3 — Uji Prediksi</h2><p>Ini ${TEST.length} contoh <b>baru</b> yang tidak ada di data latih. Label disembunyikan. Amati tiga angka ciri pada setiap kartu, lalu prediksi: jahe atau lengkuas? Setelah dikunci, tebakan tidak bisa diubah.</p><div class=note><b>Petunjuk:</b> pada babak ini, mesin membuat prediksi berdasarkan tiga angka ciri: lebar ruas, kejelasan cincin, dan kemerahan kulit. Foto tidak ditampilkan agar kamu fokus menguji pola data yang digunakan mesin.</div><div class=grid>${TEST.map(t=>`<div class=item><b>${t.id}</b><div class="note" style="margin:6px 0"><b>Sampel uji ${t.id}</b><br>Gunakan angka ciri berikut untuk membuat prediksi.</div>${meters(t.f)}${S.lock[t.id]?`<small>Tebakanmu terkunci: <b>${LB[S.lock[t.id]]}</b></small>`:`<button class=s onclick="S.lock['${t.id}']='J';save();render()">Jahe</button><button class=s onclick="S.lock['${t.id}']='L';save();render()">Lengkuas</button>`}</div>`).join('')}</div>
<p>${Object.keys(S.lock).length}/${TEST.length} terkunci</p><button ${all?'':'disabled'} onclick="reveal()">Jalankan mesin &amp; buka hasil</button></div>
${S.rev?(()=>{const e=ev(tr,TEST),me=TEST.filter(t=>S.lock[t.id]==t.y).length,tra=ev(tr,tr);return`<div class=card><h3>Hasil pengujian</h3><div class=row><div>Mesin pada data baru<div class=big>${e.ok}/${e.n}</div></div><div>Mesin pada data latih<div class=big>${tra.ok}/${tra.n}</div></div><div>Tebakanmu<div class=big>${me}/${TEST.length}</div></div></div>
<table><tr><th>ID</th><th>Tipe</th><th>Tebakanmu</th><th>Mesin</th><th>Label asli</th><th>Mesin</th></tr>${e.res.map(r=>`<tr><td>${r.s.id}</td><td>${SUB[r.s.sub].n}</td><td>${LB[S.lock[r.s.id]]}</td><td>${LB[r.p]}</td><td>${LB[r.s.y]}</td><td class="${r.p==r.s.y?'ok':'no'}">${r.p==r.s.y?'✔ benar':'✘ salah'}</td></tr>`).join('')}</table>
<div class=note>Keberhasilan pada data latih tidak otomatis berarti berhasil pada data baru. Bandingkan kedua angka di atas. Set uji ini hanya ${TEST.length} contoh, jadi satu kesalahan saja sangat memengaruhi angkanya.</div>${refl('b3','Mengapa mesin salah pada beberapa contoh? Apakah hasil pada data latih menjamin hasil pada data baru?')}<button onclick="nxt('b3','b4')">Lanjut ke Babak 4</button></div>`})():''}`},
b4:()=>{const tr=trOf(S.tr),e=ev(tr,TEST),W=e.wrong.slice(0,5);return`<div class=card><span class=tag>Observasi reflektif → Konseptualisasi</span><h2>Babak 4 — Temukan Masalah</h2><p>Modelmu salah pada <b>${e.wrong.length}</b> dari ${e.n} contoh uji. Jelaskan kemungkinan penyebabnya, bukan sekadar menebak jawaban.</p>${W.length?W.map(w=>{const nb=near(tr,w.s),ans=S.why[w.s.id];return`<div class=item style="margin:8px 0"><b>${w.s.id}</b> (${SUB[w.s.sub].n}; label asli ${LB[w.s.y]}, diprediksi ${LB[w.p]})<div class="note" style="margin:6px 0"><b>Data ciri sampel</b></div><br>Lebar ${w.s.f[0]} · Cincin ${w.s.f[1]} · Merah ${w.s.f[2]}<select onchange="S.why['${w.s.id}']=this.value;save();render()"><option value="">Pilih penyebab yang paling mungkin…</option>${RS.map((r,i)=>`<option value=${i} ${ans==i?'selected':''}>${r}</option>`).join('')}</select>${ans!==undefined&&ans!==''?`<div class=note>Bukti dari data: mesin punya <b>${S.tr.filter(i=>byId(i).sub==w.s.sub).length}</b> contoh ${SUB[w.s.sub].n} di data latihmu. Tiga tetangga terdekat: ${nb.map(n=>`${n.t.id} (${SUB[n.t.sub].n}, ${LB[n.t.y]})`).join(', ')}. Mesin memilih mayoritas tetangga, bukan "sengaja" salah.</div>`:''}</div>`}).join(''):'<div class=note>Modelmu tidak salah pada data uji ini. Lanjutkan ke perbandingan di bawah untuk melihat apakah kondisi data lain membuat perbedaan.</div>'}</div>
<div class=card><h3>Eksperimen bias: dua kondisi, data uji yang sama</h3><p><b>A</b>: hanya jahe emprit &amp; lengkuas putih. <b>B</b>: dua contoh dari tiap tipe.</p><table><tr><th>Kondisi</th><th>Data latih</th><th>Benar</th><th>Salah</th><th>Jenis kesalahan</th></tr>${cmpRow('A (terbatas)',A_SET)}${cmpRow('B (beragam)',B_SET)}${cmpRow('Pilihanmu',tr)}</table>
<div class=note><b>Rangkuman konsep.</b> Mesin belajar pola dari data latih; prediksinya hanya sebaik data yang dipelajari. Tipe yang kurang terwakili (misalnya yang berkulit kemerahan) lebih mudah salah. Bias tidak hanya soal jumlah per kategori, tapi juga <i>keterwakilan</i>, kualitas data, dan pilihan ciri. Manusia perlu menguji dan menilai hasilnya.<br><small>Catatan: pada data kecil ini, hasil bisa berbeda jika sampel dipilih berbeda; satu percobaan bukan bukti mutlak.</small></div>
${refl('b4','Tipe atau kondisi apa yang kurang terwakili dalam data latih? Bagaimana hal itu dapat memengaruhi keputusan AI di dunia nyata?')}${refl('b4e','Jika model seperti ini dipakai untuk menyaring lamaran kerja atau beasiswa, siapa yang bisa dirugikan bila datanya timpang, dan siapa yang bertanggung jawab memeriksanya?')}<button onclick="nxt('b4','b5',(${W.length==0}||Object.keys(S.why).length>0)&&need('b4e'),'Pilih penyebab untuk minimal satu kesalahan dan isi kedua refleksi (min. 30 karakter).')">Lanjut ke Babak 5</button></div>`},
b5:()=>{const b=S.base,aft=S.tr2?withM(S.ff2,()=>ev(trOf(S.tr2),TEST)):null,old=withM(S.ff0,()=>ev(trOf(S.tr),TEST)),d=aft?aft.ok-b.ok:0,F1=S.fin1;
const ch=aft?TEST.filter(t=>(old.res.find(r=>r.s.id==t.id).p==t.y)!=(aft.res.find(r=>r.s.id==t.id).p==t.y)).map(t=>`<small>${t.id} (${SUB[t.sub].n}): ${old.res.find(r=>r.s.id==t.id).p==t.y?'benar → salah':'salah → benar'}</small><br>`).join(''):'';
return`<div class=card><span class=tag>Eksperimen aktif</span><h2>Babak 5 — Perbaiki dan Uji Kembali</h2><p>Ubah ciri dan/atau komposisi data latihmu berdasarkan temuanmu, jelaskan alasannya, lalu latih ulang dan uji pada ${TEST.length} contoh yang sama.</p><h3>Ciri yang dipakai mesin</h3>${ftog()}${picker()}<button class=s onclick="S.sel=[...S.tr];S.ff=[...S.ff0];save();render()">Kembali ke pengaturan awalku</button>
<p>Alasan perubahanmu:</p><textarea rows=2 ${F1?'disabled':''} oninput="S.w5=this.value;save()">${esc(S.w5)}</textarea><br><button ${F1?'disabled':''} onclick="if(!validTr(S.sel)||S.w5.trim().length<10||!S.ff.some(x=>x)){S.msg='Pilih data valid (min. 4, ada kedua kategori), aktifkan minimal satu ciri, dan tulis alasanmu.';render()}else{S.tr2=[...S.sel];S.ff2=[...S.ff];S.msg='';save();render()}">Latih ulang &amp; uji</button></div>
${aft?`<div class=card><h3>Sebelum vs sesudah (set uji yang sama)</h3><table><tr><th></th><th>Data latih</th><th>Benar pada data uji</th></tr><tr><td>Sebelum</td><td>${b.tr}</td><td>${b.ok}/${b.n}</td></tr><tr><td>Sesudah</td><td>${S.tr2.length}</td><td>${aft.ok}/${aft.n}</td></tr></table><p><b>${d>0?'Membaik':d<0?'Memburuk':'Tetap'}</b> (${d>0?'+':''}${d} contoh).</p>${ch}<div class=note><b>Awas:</b> set uji ini sudah kamu lihat. Jika kamu mengubah data sampai angkanya bagus, mesin bisa jadi hanya disesuaikan dengan set uji ini. Karena itu ada uji akhir pada data yang belum pernah kamu lihat.</div></div>
<div class=card><h3>Uji akhir (data yang belum pernah dilihat)</h3>${F1?`<table><tr><th></th><th>Benar pada ${F1.n} contoh baru</th></tr><tr><td>Mesin awal</td><td>${F1.b}/${F1.n}</td></tr><tr><td>Mesin setelah perbaikan</td><td>${F1.a}/${F1.n}</td></tr></table><div class=note>Bandingkan dengan hasil pada set uji lama. Apakah perbaikanmu juga berhasil pada data baru? Set ini kecil, jadi satu percobaan bukan bukti mutlak.</div>${refl('b5','Apa yang kamu ubah dan mengapa? Apakah hasil uji akhir sama dengan hasil pada set uji lama? Mengapa uji akhir hanya boleh dibuka sekali?')}<button onclick="nxt('b5','post',1)">Lanjut ke Pasca-tes</button>`:`<p>Uji akhir hanya bisa dibuka <b>sekali</b>. Setelah dibuka, pengaturanmu terkunci.</p><button onclick="S.fin1={b:withM(S.ff0,()=>ev(trOf(S.tr),FIN)).ok,a:withM(S.ff2,()=>ev(trOf(S.tr2),FIN)).ok,n:FIN.length};save();render()">Buka uji akhir (sekali saja)</button>`}</div>`:''}`},
post:()=>`<div class=card><h2>Pasca-tes</h2><p>Jawab berdasarkan pemahamanmu sekarang. Soalnya berbeda dari pra-tes, tetapi konsepnya sama. Jika belum tahu, pilih Tidak tahu.</p>${quiz('post')}<button onclick="nxt(0,'sum',done('post'),'Jawab semua soal dan isi soal 7.')">Lihat ringkasan</button></div>`,
sum:()=>{const t=teacher();return`<div class=card><h2>Ringkasan hasil belajar</h2><div class=row><div>Pra-tes<div class=big>${score('pre')}/${QS.pre.length}</div></div><div>Pasca-tes<div class=big>${score('post')}/${QS.pre.length}</div></div><div>Selisih<div class=big>${score('post')-score('pre')>0?'+':''}${score('post')-score('pre')}</div></div></div>
<div class=note><b>Yang kamu alami:</b> mesin belajar dari contoh yang kamu pilih, bisa salah pada tipe yang kurang terwakili, dan perlu diuji serta diperbaiki. Keterbatasan: data di sini kecil, sintetis, dan hanya 3 ciri, jadi ini model sederhana untuk memahami konsep, bukan pengganti ML gambar sungguhan.</div>
<h3>Ringkasan untuk guru (salin &amp; tempel)</h3><textarea id=tx rows=12 readonly>${esc(t)}</textarea><button onclick="const x=document.getElementById('tx');x.select();try{navigator.clipboard.writeText(x.value)}catch(e){document.execCommand('copy')}this.textContent='Tersalin ✔'">Salin ringkasan</button><button class=s onclick="dl()">Unduh rekap (CSV)</button><button class=s onclick="if(confirm('Mulai putaran baru dari Babak 1? Pra-tes dan pasca-tes tetap tersimpan.')){const{pre,preT,post,postT,kode,rl}=S;S=Object.assign(def(),{pre,preT,post,postT,kode,rl});save();go('b1')}">Main lagi dari Babak 1</button></div>`}};
function teacher(){const b=S.base,a=S.tr2?withM(S.ff2,()=>ev(trOf(S.tr2),TEST)):null,sc=k=>QS[k].map((q,i)=>S[k][i]===q.a?'✔':'✘').join(' ');
return`RINGKASAN TRAIN THE MACHINE — Kelompok: ${S.kode||'(tanpa nama)'}
Peran: ${peranTxt()}
Pra-tes: ${score('pre')}/${QS.pre.length} [${sc('pre')}] | Pasca-tes: ${score('post')}/${QS.pre.length} [${sc('post')}] | Selisih: ${score('post')-score('pre')}
Uraian pra-tes: ${S.preT}
Uraian pasca-tes: ${S.postT}
Babak 1 — ciri dipilih: ${S.f.map(i=>FN[i]).join('; ')}; dugaan: ${S.hip}
Babak 2 — data latih awal: ${S.tr?S.tr.length+' contoh ('+comp(trOf(S.tr))+')':'-'}
Babak 3 — benar pada data baru: ${b?b.ok+'/'+b.n:'-'}; tebakan siswa benar: ${TEST.filter(t=>S.lock[t.id]==t.y).length}/${TEST.length}
Babak 4 — penyebab dipilih siswa: ${Object.entries(S.why).map(([k,v])=>k+'='+RS[v]).join('; ')||'-'}
Babak 5 — data latih akhir: ${S.tr2?S.tr2.length+' contoh ('+comp(trOf(S.tr2))+')':'-'}; benar: ${a?a.ok+'/'+a.n:'-'}; alasan: ${S.w5}
Refleksi B1: ${S.rf.b1||'-'}
Refleksi B2: ${S.rf.b2||'-'}
Refleksi B3: ${S.rf.b3||'-'}
Refleksi B4: ${S.rf.b4||'-'}
Refleksi B4 (etika): ${S.rf.b4e||'-'}
Refleksi B5: ${S.rf.b5||'-'}
Uji akhir (data baru, sekali): ${S.fin1?'sebelum '+S.fin1.b+'/'+S.fin1.n+', sesudah '+S.fin1.a+'/'+S.fin1.n:'-'}
Ciri aktif awal: ${FN.filter((_,i)=>S.ff0&&S.ff0[i]).join('; ')||'-'} | akhir: ${FN.filter((_,i)=>S.ff2&&S.ff2[i]).join('; ')||'-'} | sampel ukur sendiri: ${S.mine.length}`}
render();
</script></body></html>
